name: Publish platform release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, e.g. v1.0.0'
        required: true
permissions:
  contents: read
concurrency:
  group: platform-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and prevent overwriting a release
        run: |
          python -c 'import os; from updater.release import version; version(os.environ["VERSION"])'
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo 'Version already exists'; exit 1
          fi
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s updater/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: backend
          push: true
          tags: ghcr.io/xorizo-n/fleet-manager-backend:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/Xorizo-n/FleetManager-Server
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: frontend
          push: true
          tags: ghcr.io/xorizo-n/fleet-manager-frontend:${{ inputs.version }}
          build-args: VITE_API_BASE_URL=/api
          labels: org.opencontainers.image.source=https://github.com/Xorizo-n/FleetManager-Server
      - name: Test the exact server image
        env:
          BACKEND: ghcr.io/xorizo-n/fleet-manager-backend@${{ steps.backend.outputs.digest }}
        run: |
          docker run --rm -e JWT_SECRET_KEY=test -e CREDENTIAL_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= -v "$PWD/docker-compose.yml:/docker-compose.yml:ro" "$BACKEND" python -m unittest discover -s tests
          docker run -d --name migration-db -e POSTGRES_USER=fleet -e POSTGRES_PASSWORD=test -e POSTGRES_DB=fleet postgres:15
          until docker exec migration-db pg_isready -U fleet; do sleep 2; done
          docker run --rm --network container:migration-db -e JWT_SECRET_KEY=test -e CREDENTIAL_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= -e DATABASE_URL=postgresql+psycopg://fleet:test@localhost:5432/fleet "$BACKEND" alembic upgrade head
      - name: Assemble and publish only the complete release
        env:
          BACKEND: ghcr.io/xorizo-n/fleet-manager-backend@${{ steps.backend.outputs.digest }}
          FRONTEND: ghcr.io/xorizo-n/fleet-manager-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          python -m scripts.build_platform_release --version "$VERSION" --commit "$GITHUB_SHA" --backend "$BACKEND" --frontend "$FRONTEND"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "FleetManager $VERSION" --draft --generate-notes
          gh release upload "$VERSION" release-output/platform.json release-output/platform.tar.gz
          gh release edit "$VERSION" --draft=false --latest
