# Контейнеры, которым нужен резолв внутренних имён (*.rtf.ustu), используют
# корпоративные DNS напрямую: DNS хоста смешивает внутренние серверы с публичным
# (77.88.8.8), из-за чего внутренняя зона резолвится недетерминированно.
x-corp-dns: &corp-dns
  dns:
    - ${DNS_SERVER_1:-10.40.240.1}
    - ${DNS_SERVER_2:-10.40.240.3}
  dns_search:
    - ${DNS_SEARCH_DOMAIN:-rtf.ustu}

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *corp-dns
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ANSIBLE_FORKS: ${ANSIBLE_FORKS:-20}
      TZ: Asia/Yekaterinburg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ansible_data:/app/ansible_data
      - ./ansible:/app/ansible:ro
      - ${SOFT_SHARE_DIR:-/mnt/soft-share}:/mnt/soft-share
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  celery:
    <<: *corp-dns
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ANSIBLE_FORKS: ${ANSIBLE_FORKS:-20}
      TZ: Asia/Yekaterinburg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ansible_data:/app/ansible_data
      - ./ansible:/app/ansible:ro
      - ${SOFT_SHARE_DIR:-/mnt/soft-share}:/mnt/soft-share:ro
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=4

  celery-beat:
    <<: *corp-dns
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ansible_data:/app/ansible_data
    command: celery -A celery_app.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
        restart: true
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  ansible_data:
