# Контейнеры, которым нужен резолв внутренних имён, используют корпоративные DNS
# напрямую: DNS хоста смешивает внутренние серверы с публичным (77.88.8.8), из-за
# чего внутренние зоны резолвятся недетерминированно.
#
# Серверы rtf.ustu знают обе зоны (at.urfu.ru — через пересылку). Контроллеры
# at.urfu.ru — только запасные: на *.rtf.ustu они отвечают NXDOMAIN, а Docker
# переходит к следующему серверу лишь при отказе, не при отрицательном ответе.
# Встроенный DNS Docker использует не больше трёх серверов.
#
# Агент сообщает короткое имя ПК (SU5-D206-TEMP), домен ищется по списку.
# at.urfu.ru первым: ПК переезжают туда, а в rtf.ustu остались устаревшие записи,
# указывающие на чужие адреса.
x-corp-dns: &corp-dns
  dns:
    - ${DNS_SERVER_1:-10.40.240.1}
    - ${DNS_SERVER_2:-10.40.240.3}
    - ${DNS_SERVER_3:-10.74.240.10}
  dns_search:
    - ${DNS_SEARCH_DOMAIN_1:-at.urfu.ru}
    - ${DNS_SEARCH_DOMAIN_2:-rtf.ustu}

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    entrypoint: /opt/fleet-manager/postgres-entrypoint.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/fleet-manager/postgres-entrypoint.sh:/opt/fleet-manager/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *corp-dns
    build:
      context: ./backend
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ANSIBLE_FORKS: ${ANSIBLE_FORKS:-20}
      TZ: Asia/Yekaterinburg
      TMPDIR: /mnt/soft-share/.upload-tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ansible_data:/app/ansible_data
      - ./ansible:/app/ansible:ro
      - ${SOFT_SHARE_DIR:-/mnt/soft-share}:/mnt/soft-share
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  celery:
    <<: *corp-dns
    # PID 1 должен пожинать осиротевших потомков: ansible/ssh при таймаутах
    # к offline-хостам оставляют зомби, celery их не reap-ит, и за сутки
    # упираемся в pids.max cgroup (Errno 11 на любом fork). tini это чинит.
    init: true
    build:
      context: ./backend
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ANSIBLE_FORKS: ${ANSIBLE_FORKS:-20}
      TZ: Asia/Yekaterinburg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ansible_data:/app/ansible_data
      - ./ansible:/app/ansible:ro
      # Без :ro — почасовая задача sync-agent-installer выполняется именно в этом
      # воркере и пишет сюда FleetManagerAgent-Setup.exe и его .version.
      - ${SOFT_SHARE_DIR:-/mnt/soft-share}:/mnt/soft-share
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=4

  celery-beat:
    <<: *corp-dns
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ansible_data:/app/ansible_data
    command: celery -A celery_app.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Для временного самоподписанного сертификата, пока в ./certs нет настоящего
      TLS_SELF_SIGNED_SAN: ${TLS_SELF_SIGNED_SAN:-IP:10.40.240.154,DNS:localhost}
    volumes:
      # fleet.crt + fleet.key (в git не попадают). Сертификат от УЦ кладётся сюда же.
      - ./certs:/etc/nginx/certs
    ports:
      - "443:443"   # сайт и API по HTTPS
      - "80:80"     # перенаправление на HTTPS
      - "8080:8080" # API для агентов по HTTP: в agent.json у них http://<сервер>:8080

volumes:
  postgres_data:
  redis_data:
  ansible_data:
