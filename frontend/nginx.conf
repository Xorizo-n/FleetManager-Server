# 443 — сайт и API по HTTPS. Сертификат и ключ — в /etc/nginx/certs (том ./certs
# в docker-compose.yml). Пока их нет, при старте контейнера генерируется
# временный самоподписанный (docker-entrypoint.d/40-fleet-tls.sh). Сертификат
# от УЦ УрФУ кладётся туда же под теми же именами, затем перезапуск frontend.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fleet.crt;
    ssl_certificate_key /etc/nginx/certs/fleet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/fleet/api.conf;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# 80 — браузеры переходят на HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 8080 — агенты. В agent.json у них http://<сервер>:8080, и в установщики сервер
# встраивает его же (AGENT_PUBLIC_URL). Перенаправить их на HTTPS нельзя: и
# HttpClient агента, и Invoke-WebRequest при удалённом обновлении отбрасывают
# заголовок Authorization при редиректе. Поэтому API здесь остаётся по HTTP,
# а интерфейс открывается только по HTTPS.
server {
    listen 8080;
    server_name _;

    include /etc/nginx/fleet/api.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
