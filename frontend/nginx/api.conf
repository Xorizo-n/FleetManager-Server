# API proxy: /api/auth/login → backend:8000/auth/login. Included by the 443 and
# 8080 servers in nginx.conf.
#
# Docker embedded DNS with a short TTL + $backend_upstream variable: nginx
# re-resolves the backend container IP on each request instead of caching
# it once at startup. Without this, recreating the backend container (new
# IP) breaks all API calls with 502 until nginx itself is restarted.
# NOTE: proxy_pass through a variable disables nginx's automatic location-
# prefix stripping, so /api/ must be stripped explicitly via rewrite.
resolver 127.0.0.11 valid=10s;
set $backend_upstream backend:8000;

location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    # Stream the request body straight to the backend instead of
    # buffering it whole to /var/cache/nginx (backed by the small root
    # disk) first - required for multi-GB installer uploads.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 20g;
}
